<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');
  /* 縦に大きなボタンを並べるだけの入り口ページ */
  :root {
    --bg: #EEF3EF; --surface: #FFFFFF; --border: #CFDCD3; --text: #1F2A24; --sub: #5B6A61;
    --green: #2E6B4E; --blue: #2B5683; --gold: #8A6A1F; --red: #A8452F; --teal: #1F6B73; --purple: #5B4A8B;
    --green-l: #E1EEE6; --blue-l: #E2EBF5; --gold-l: #F6EBD7; --red-l: #F6E2DC; --teal-l: #DDEEF0; --purple-l: #ECE7F6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141A16; --surface: #1D2520; --border: #34413A; --text: #E6EEE9; --sub: #9EB0A5;
      --green: #7CC39C; --blue: #8DB4E0; --gold: #E0BE6E; --red: #E79A86; --teal: #7CC8CF; --purple: #B9A8E8;
      --green-l: #22362B; --blue-l: #1F2B3A; --gold-l: #352C18; --red-l: #3A231D; --teal-l: #1B3336; --purple-l: #2A2440;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Zen Kaku Gothic New', -apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif;
    line-height: 1.6;
    padding: max(28px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  .wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  header img { width: 44px; height: 44px; border-radius: 10px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: .04em; }
  .today { font-size: 13px; color: var(--sub); margin: 0; }
  a.app {
    display: flex; align-items: center; gap: 14px; text-decoration: none; color: var(--text);
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px 16px; min-height: 84px; transition: transform .08s, border-color .15s;
  }
  a.app:hover { border-color: var(--c); }
  a.app:active { transform: scale(.985); }
  a.app:focus-visible { outline: 3px solid var(--c); outline-offset: 2px; }
  .mark { flex-shrink: 0; width: 48px; height: 48px; border-radius: 12px; background: var(--cl); color: var(--c); display: grid; place-items: center; font-size: 20px; font-weight: 700; }
  .txt { flex: 1; min-width: 0; }
  .name { font-size: 18px; font-weight: 700; }
  .desc { font-size: 13px; color: var(--sub); }
  .arrow { color: var(--sub); font-size: 22px; }
  .sales { --c: var(--green); --cl: var(--green-l); }
  .mujin { --c: var(--blue); --cl: var(--blue-l); }
  .shushi { --c: var(--gold); --cl: var(--gold-l); }
  .regi { --c: var(--red); --cl: var(--red-l); }
  .shorui { --c: var(--teal); --cl: var(--teal-l); }
  .kintai { --c: var(--purple); --cl: var(--purple-l); }
  .note { font-size: 12px; color: var(--sub); margin-top: 6px; }
  @media (prefers-reduced-motion: reduce) { a.app { transition: none; } }
</style>
</head>
